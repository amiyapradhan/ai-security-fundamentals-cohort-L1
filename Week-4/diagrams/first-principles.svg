<svg viewBox="0 0 1160 490" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="1160" height="490" fill="#FBFAF7"/>
  <rect x="6" y="6" width="1148" height="478" rx="18" fill="none" stroke="#E7E3D9" stroke-width="2"/>
  
  <text x="48" y="88" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="27" font-weight="bold"
        fill="#15152B">Three facts about models &#8212; and what each one enables</text>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4 L0,8 Z" fill="#15152B"/>
    </marker>
    <marker id="arrRed" markerWidth="10" markerHeight="10" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4 L0,8 Z" fill="#C7452F"/>
    </marker>
    <marker id="arrAmb" markerWidth="12" markerHeight="12" refX="8.5" refY="4.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4.5 L0,9 Z" fill="#B9822A"/>
    </marker>
    <pattern id="hatch" width="9" height="9" patternTransform="rotate(45)"
             patternUnits="userSpaceOnUse">
      <rect width="9" height="9" fill="#F3E7CF"/>
      <line x1="0" y1="0" x2="0" y2="9" stroke="#B9822A" stroke-width="1.4" opacity="0.55"/>
    </pattern>
  </defs><rect x="48.0" y="150" width="336" height="300" rx="14" fill="#ffffff" stroke="#E7E3D9" stroke-width="2"/><rect x="48.0" y="150" width="336" height="86" rx="14" fill="#DCEEE9"/><rect x="48.0" y="222" width="336" height="14" fill="#DCEEE9"/><text x="216.0" y="188" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="18" font-weight="bold" fill="#2F8F7F" text-anchor="middle">Optimises a loss,</text><text x="216.0" y="214" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="18" font-weight="bold" fill="#2F8F7F" text-anchor="middle">not correctness</text><text x="216.0" y="270" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="13" fill="#5E5E6E" text-anchor="middle">It learns whatever cuts the loss &#8212;</text><text x="216.0" y="290" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="13" fill="#5E5E6E" text-anchor="middle">including patterns you never meant it to.</text><line x1="216.0" y1="306" x2="216.0" y2="346" stroke="#2F8F7F" stroke-width="2.4" marker-end="url(#arr)"/><path d="M211.0,342 L221.0,342 L216.0,350 Z" fill="#2F8F7F"/><rect x="70.0" y="358" width="292" height="70" rx="10" fill="#DCEEE9" stroke="#2F8F7F" stroke-width="1.6"/><text x="216.0" y="390" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="16" font-weight="bold" fill="#2F8F7F" text-anchor="middle">Poisoning</text><text x="216.0" y="412" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12.5" fill="#5E5E6E" text-anchor="middle">+ confident wrong answers</text><rect x="412.0" y="150" width="336" height="300" rx="14" fill="#ffffff" stroke="#E7E3D9" stroke-width="2"/><rect x="412.0" y="150" width="336" height="86" rx="14" fill="#DEE8F4"/><rect x="412.0" y="222" width="336" height="14" fill="#DEE8F4"/><text x="580.0" y="188" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="18" font-weight="bold" fill="#3B6FB0" text-anchor="middle">Generalises,</text><text x="580.0" y="214" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="18" font-weight="bold" fill="#3B6FB0" text-anchor="middle">doesn&#8217;t reason</text><text x="580.0" y="270" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="13" fill="#5E5E6E" text-anchor="middle">It extends training patterns; it doesn&#8217;t</text><text x="580.0" y="290" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="13" fill="#5E5E6E" text-anchor="middle">check whether an input is truly right.</text><line x1="580.0" y1="306" x2="580.0" y2="346" stroke="#3B6FB0" stroke-width="2.4" marker-end="url(#arr)"/><path d="M575.0,342 L585.0,342 L580.0,350 Z" fill="#3B6FB0"/><rect x="434.0" y="358" width="292" height="70" rx="10" fill="#DEE8F4" stroke="#3B6FB0" stroke-width="1.6"/><text x="580.0" y="390" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="16" font-weight="bold" fill="#3B6FB0" text-anchor="middle">Evasion</text><text x="580.0" y="412" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12.5" fill="#5E5E6E" text-anchor="middle">inputs placed in the boundary gap</text><rect x="776.0" y="150" width="336" height="300" rx="14" fill="#ffffff" stroke="#E7E3D9" stroke-width="2"/><rect x="776.0" y="150" width="336" height="86" rx="14" fill="#F6E1DB"/><rect x="776.0" y="222" width="336" height="14" fill="#F6E1DB"/><text x="944.0" y="188" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="18" font-weight="bold" fill="#C7452F" text-anchor="middle">Confidence is an</text><text x="944.0" y="214" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="18" font-weight="bold" fill="#C7452F" text-anchor="middle">artifact of training</text><text x="944.0" y="270" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="13" fill="#5E5E6E" text-anchor="middle">A high score is a learned style,</text><text x="944.0" y="290" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="13" fill="#5E5E6E" text-anchor="middle">not a measure of truth.</text><line x1="944.0" y1="306" x2="944.0" y2="346" stroke="#C7452F" stroke-width="2.4" marker-end="url(#arr)"/><path d="M939.0,342 L949.0,342 L944.0,350 Z" fill="#C7452F"/><rect x="798.0" y="358" width="292" height="70" rx="10" fill="#F6E1DB" stroke="#C7452F" stroke-width="1.6"/><text x="944.0" y="390" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="16" font-weight="bold" fill="#C7452F" text-anchor="middle">Membership inference</text><text x="944.0" y="412" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12.5" fill="#5E5E6E" text-anchor="middle">+ over-trusted outputs</text>
</svg>