<svg viewBox="0 0 1120 580" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="1120" height="580" fill="#FBFAF7"/>
  <rect x="6" y="6" width="1108" height="568" rx="18" fill="none" stroke="#E7E3D9" stroke-width="2"/>
  
  <text x="48" y="88" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="27" font-weight="bold"
        fill="#15152B">The system doesn&#8217;t add attacks. It adds reach.</text>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4 L0,8 Z" fill="#15152B"/>
    </marker>
    <marker id="arrRed" markerWidth="10" markerHeight="10" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4 L0,8 Z" fill="#C7452F"/>
    </marker>
    <marker id="arrAmb" markerWidth="12" markerHeight="12" refX="8.5" refY="4.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4.5 L0,9 Z" fill="#B9822A"/>
    </marker>
    <pattern id="hatch" width="9" height="9" patternTransform="rotate(45)"
             patternUnits="userSpaceOnUse">
      <rect width="9" height="9" fill="#F3E7CF"/>
      <line x1="0" y1="0" x2="0" y2="9" stroke="#B9822A" stroke-width="1.4" opacity="0.55"/>
    </pattern>
  </defs><rect x="60" y="250" width="300" height="120" rx="14" fill="#F6E1DB" stroke="#C7452F" stroke-width="2.5"/><text x="210.0" y="296" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="16" font-weight="bold" fill="#C7452F" text-anchor="middle">one injected instruction</text><text x="210.0" y="322" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="13.5" fill="#5E5E6E" text-anchor="middle">a single model-level</text><text x="210.0" y="342" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="13.5" fill="#5E5E6E" text-anchor="middle">compromise</text><rect x="720" y="150" width="340" height="86" rx="12" fill="#DCEEE9" stroke="#2F8F7F" stroke-width="2"/><text x="890.0" y="185" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="15.5" font-weight="bold" fill="#2F8F7F" text-anchor="middle">retrieval store</text><text x="890.0" y="209" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="13" fill="#5E5E6E" text-anchor="middle">pulls in more poisoned sources</text><path d="M360,310.0 C540.0,310.0 540.0,193 714,193" fill="none" stroke="#B9822A" stroke-width="2.4" marker-end="url(#arrAmb)"/><text x="540.0" y="245.5" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12.5" fill="#B9822A" font-weight="bold" text-anchor="middle">+ blast radius</text><rect x="720" y="300" width="340" height="86" rx="12" fill="#DEE8F4" stroke="#3B6FB0" stroke-width="2"/><text x="890.0" y="335" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="15.5" font-weight="bold" fill="#3B6FB0" text-anchor="middle">tools / APIs</text><text x="890.0" y="359" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="13" fill="#5E5E6E" text-anchor="middle">turns a decision into a real-world action</text><path d="M360,310.0 C540.0,310.0 540.0,343 714,343" fill="none" stroke="#B9822A" stroke-width="2.4" marker-end="url(#arrAmb)"/><text x="540.0" y="320.5" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12.5" fill="#B9822A" font-weight="bold" text-anchor="middle">+ blast radius</text><rect x="720" y="450" width="340" height="86" rx="12" fill="#F3E7CF" stroke="#B9822A" stroke-width="2"/><text x="890.0" y="485" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="15.5" font-weight="bold" fill="#B9822A" text-anchor="middle">a second agent (A2A)</text><text x="890.0" y="509" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="13" fill="#5E5E6E" text-anchor="middle">transitive trust: A trusts B, B is hit</text><path d="M360,310.0 C540.0,310.0 540.0,493 714,493" fill="none" stroke="#B9822A" stroke-width="2.4" marker-end="url(#arrAmb)"/><text x="540.0" y="395.5" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12.5" fill="#B9822A" font-weight="bold" text-anchor="middle">+ blast radius</text><text x="60" y="236" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="13.5" fill="#5E5E6E">not new exploits &#8212; the same compromise, given range &#8594;</text>
</svg>