<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 375" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" role="img" aria-label="The data shapes the model's boundary; three data failures (bias, shortcut, poisoning) produce a wrong boundary, which is why attacks work.">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" fill="#9A917F"/></marker>
  </defs>
  <rect x="0.5" y="0.5" width="679" height="374" rx="14" fill="#FCFAF6" stroke="#E7DECF"/>

  <g>
    <rect x="240" y="40" width="200" height="56" rx="8" fill="#F1ECE1" stroke="#D8CDBA" stroke-width="1.3"/>
    <text x="340" y="62" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#3A352C">The data</text>
    <text x="340" y="80" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#7B7263">the model's only world</text>
  </g>

  <line x1="340" y1="96" x2="140" y2="127" stroke="#9A917F" stroke-width="1.1" marker-end="url(#ah)"/>
  <line x1="340" y1="96" x2="338" y2="127" stroke="#9A917F" stroke-width="1.1" marker-end="url(#ah)"/>
  <line x1="340" y1="96" x2="540" y2="127" stroke="#9A917F" stroke-width="1.1" marker-end="url(#ah)"/>

  <g>
    <rect x="44" y="130" width="176" height="56" rx="8" fill="#FBE7DD" stroke="#EEB69D" stroke-width="1.3"/>
    <text x="132" y="152" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#A8431F">Bias</text>
    <text x="132" y="170" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#B5572F">data too narrow</text>
  </g>
  <g>
    <rect x="250" y="130" width="176" height="56" rx="8" fill="#FBE7DD" stroke="#EEB69D" stroke-width="1.3"/>
    <text x="338" y="152" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#A8431F">Shortcut</text>
    <text x="338" y="170" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#B5572F">spurious correlation</text>
  </g>
  <g>
    <rect x="456" y="130" width="176" height="56" rx="8" fill="#FBE7DD" stroke="#EEB69D" stroke-width="1.3"/>
    <text x="544" y="152" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#A8431F">Poisoning</text>
    <text x="544" y="170" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#B5572F">crafted bad data</text>
  </g>

  <line x1="132" y1="186" x2="332" y2="217" stroke="#9A917F" stroke-width="1.1" marker-end="url(#ah)"/>
  <line x1="338" y1="186" x2="340" y2="217" stroke="#9A917F" stroke-width="1.1" marker-end="url(#ah)"/>
  <line x1="544" y1="186" x2="348" y2="217" stroke="#9A917F" stroke-width="1.1" marker-end="url(#ah)"/>

  <g>
    <rect x="240" y="220" width="200" height="56" rx="8" fill="#ECE8F8" stroke="#C6BBEC" stroke-width="1.3"/>
    <text x="340" y="242" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#4A3A8C">Wrong boundary</text>
    <text x="340" y="260" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#6E5FB0">carved confidently</text>
  </g>

  <line x1="340" y1="276" x2="340" y2="297" stroke="#9A917F" stroke-width="1.1" marker-end="url(#ah)"/>

  <g>
    <rect x="44" y="300" width="592" height="56" rx="8" fill="#FBE7DD" stroke="#EEB69D" stroke-width="1.3"/>
    <text x="340" y="322" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#A8431F">It learned a function — not understanding</text>
    <text x="340" y="340" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#B5572F">that's why attacks work: nudge the input or the data, and the boundary obeys</text>
  </g>
</svg>
