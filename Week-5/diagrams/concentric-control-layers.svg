<svg viewBox="0 0 700 360" role="img" aria-label="Concentric rings of controls around the model: network, identity and access, input and output controls, model core, all wrapped by logging, monitoring and incident response." xmlns="http://www.w3.org/2000/svg" width="700" height="360"><style>.svgtxt{font-family:'Hanken Grotesk','DejaVu Sans',sans-serif;fill:#221C15}.svgmono{font-family:'JetBrains Mono','DejaVu Sans Mono',monospace}.svgmut{fill:#6E6557}</style><rect x="0" y="0" width="700" height="360" fill="#FAF6EF"/>
        <rect x="20" y="20" width="660" height="320" rx="16" fill="#E4F1EA" stroke="#A6D4C0"/>
        <text x="350" y="44" text-anchor="middle" class="svgmono" font-size="11" font-weight="700" fill="#0E5C45" letter-spacing="2">LOGGING · MONITORING · INCIDENT RESPONSE  (wraps everything)</text>
        <rect x="70" y="58" width="560" height="262" rx="14" fill="#FFFDF8" stroke="#E5DCCC"/>
        <text x="350" y="80" text-anchor="middle" class="svgtxt svgmut" font-size="12" font-weight="700">NETWORK &amp; INFRASTRUCTURE — what can reach the system at all</text>
        <rect x="120" y="92" width="460" height="206" rx="12" fill="#F4EEE3" stroke="#E5DCCC"/>
        <text x="350" y="113" text-anchor="middle" class="svgtxt svgmut" font-size="12" font-weight="700">IDENTITY &amp; ACCESS — who may interact, with what rights</text>
        <rect x="170" y="124" width="360" height="150" rx="10" fill="#FFFDF8" stroke="#E5DCCC"/>
        <text x="350" y="145" text-anchor="middle" class="svgtxt svgmut" font-size="12" font-weight="700">INPUT &amp; OUTPUT CONTROLS — filter what it sees / produces</text>
        <rect x="250" y="160" width="200" height="98" rx="40" fill="#0E5C45"/>
        <text x="350" y="200" text-anchor="middle" fill="#FAF6EF" class="svgtxt" font-size="15" font-weight="700">MODEL</text>
        <text x="350" y="222" text-anchor="middle" fill="#FAF6EF" class="svgtxt" font-size="10.5">config · eval · deploy</text>
        <text x="350" y="240" text-anchor="middle" fill="#FAF6EF" class="svgmono" font-size="9" opacity="0.85">untrusted by default</text>
      </svg>