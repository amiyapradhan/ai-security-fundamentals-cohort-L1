<svg viewBox="0 0 700 130" role="img" aria-label="Where controls intervene across an AI request lifecycle: input handling and validation, orchestration logic, policy enforcement restricting what the model sees, the model as an untrusted suggestion, then output gating before a system action." xmlns="http://www.w3.org/2000/svg" width="700" height="130"><style>.svgtxt{font-family:'Hanken Grotesk','DejaVu Sans',sans-serif;fill:#221C15}.svgmono{font-family:'JetBrains Mono','DejaVu Sans Mono',monospace}.svgmut{fill:#6E6557}</style><rect x="0" y="0" width="700" height="130" fill="#FAF6EF"/>
        <defs><marker id="ar6" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a917f"/></marker></defs>
        <g font-size="9" class="svgtxt" font-weight="700" text-anchor="middle">
          <rect x="10" y="40" width="86" height="44" rx="8" fill="#F4EEE3" stroke="#E5DCCC"/><text x="53" y="60">USER</text><text x="53" y="73">INPUT</text>
          <rect x="156" y="40" width="100" height="44" rx="8" fill="#FFFDF8" stroke="#A6D4C0"/><text x="206" y="60">ORCHEST-</text><text x="206" y="73">RATION</text>
          <rect x="316" y="40" width="92" height="44" rx="8" fill="#0E5C45"/><text x="362" y="59" fill="#FAF6EF">MODEL</text><text x="362" y="72" fill="#FAF6EF" font-size="7" font-weight="400">untrusted</text>
          <rect x="468" y="40" width="100" height="44" rx="8" fill="#FFFDF8" stroke="#A6D4C0"/><text x="518" y="60">SYSTEM</text><text x="518" y="73">ACTION</text>
        </g>
        <g stroke="#9a917f" stroke-width="1.5" fill="none" marker-end="url(#ar6)">
          <line x1="96" y1="62" x2="154" y2="62"/><line x1="256" y1="62" x2="314" y2="62"/><line x1="408" y1="62" x2="466" y2="62"/>
        </g>
        <g class="svgmono" font-size="7.5" fill="#0E5C45" font-weight="700" text-anchor="middle">
          <text x="125" y="30">🛡 input</text><text x="125" y="100">validation</text>
          <text x="285" y="30">🛡 policy</text><text x="285" y="100">(restrict view)</text>
          <text x="437" y="30">🛡 output</text><text x="437" y="100">gating</text>
        </g>
        <rect x="588" y="40" width="100" height="44" rx="8" fill="#E4F1EA" stroke="#A6D4C0"/>
        <text x="638" y="65" text-anchor="middle" class="svgtxt" font-size="8" fill="#0E5C45" font-weight="700">🛡 = a control</text>
      </svg>