<svg viewBox="0 0 700 250" role="img" aria-label="Zero trust around a central system: the user is authenticated, retrieved RAG data is validated, external tool access is authorised, and model output is verified before use." xmlns="http://www.w3.org/2000/svg" width="700" height="250"><style>.svgtxt{font-family:'Hanken Grotesk','DejaVu Sans',sans-serif;fill:#221C15}.svgmono{font-family:'JetBrains Mono','DejaVu Sans Mono',monospace}.svgmut{fill:#6E6557}</style><rect x="0" y="0" width="700" height="250" fill="#FAF6EF"/>
        <rect x="290" y="100" width="120" height="60" rx="12" fill="#0E5C45"/>
        <text x="350" y="128" text-anchor="middle" fill="#FAF6EF" class="svgtxt" font-size="11" font-weight="700">CENTRAL</text>
        <text x="350" y="144" text-anchor="middle" fill="#FAF6EF" class="svgtxt" font-size="11" font-weight="700">SYSTEM</text>
        <g class="svgtxt" font-size="10" font-weight="700" text-anchor="middle">
          <rect x="40" y="30" width="120" height="44" rx="9" fill="#F4EEE3" stroke="#E5DCCC"/><text x="100" y="57">USER</text>
          <rect x="540" y="30" width="120" height="44" rx="9" fill="#F4EEE3" stroke="#E5DCCC"/><text x="600" y="51">RETRIEVED</text><text x="600" y="65" font-size="9">DATA (RAG)</text>
          <rect x="40" y="186" width="120" height="44" rx="9" fill="#F4EEE3" stroke="#E5DCCC"/><text x="100" y="207">EXTERNAL</text><text x="100" y="221" font-size="9">TOOL / API</text>
          <rect x="540" y="186" width="120" height="44" rx="9" fill="#F4EEE3" stroke="#E5DCCC"/><text x="600" y="213">MODEL</text>
        </g>
        <g stroke="#A6D4C0" stroke-width="1.6" fill="none">
          <line x1="160" y1="58" x2="288" y2="108"/><line x1="540" y1="58" x2="412" y2="108"/>
          <line x1="160" y1="206" x2="288" y2="152"/><line x1="540" y1="206" x2="412" y2="152"/>
        </g>
        <g class="svgmono" font-size="8" fill="#0E5C45" font-weight="700" text-anchor="middle">
          <text x="205" y="74">🛡 authenticate</text><text x="495" y="74">🛡 validate data</text>
          <text x="205" y="182">🛡 authorise tool</text><text x="495" y="182">🛡 verify output</text>
        </g>
      </svg>