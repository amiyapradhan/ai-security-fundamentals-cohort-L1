<svg viewBox="0 0 700 196" role="img" aria-label="Four identities in an AI system — human user, backend service, AI model, and agent — each with what it can and cannot do." xmlns="http://www.w3.org/2000/svg" width="700" height="196"><style>.svgtxt{font-family:'Hanken Grotesk','DejaVu Sans',sans-serif;fill:#221C15}.svgmono{font-family:'JetBrains Mono','DejaVu Sans Mono',monospace}.svgmut{fill:#6E6557}</style><rect x="0" y="0" width="700" height="196" fill="#FAF6EF"/>
        <g class="svgtxt" font-size="10.5">
          <rect x="14" y="20" width="156" height="160" rx="11" fill="#FFFDF8" stroke="#E5DCCC"/>
          <rect x="184" y="20" width="156" height="160" rx="11" fill="#FFFDF8" stroke="#E5DCCC"/>
          <rect x="354" y="20" width="156" height="160" rx="11" fill="#FFFDF8" stroke="#E5DCCC"/>
          <rect x="524" y="20" width="162" height="160" rx="11" fill="#FFFDF8" stroke="#EEB69D"/>
          <text x="92" y="48" text-anchor="middle" font-weight="700">HUMAN USER</text>
          <text x="262" y="48" text-anchor="middle" font-weight="700">BACKEND SVC</text>
          <text x="432" y="48" text-anchor="middle" font-weight="700">AI MODEL</text>
          <text x="605" y="42" text-anchor="middle" font-weight="700">AGENT</text>
          <text x="605" y="58" text-anchor="middle" font-size="8" fill="#A8431F">⚠ high-risk identity</text>
        </g>
        <g font-size="9.5" class="svgtxt">
          <text x="30" y="82" fill="#0E5C45" font-weight="700">CAN</text><text x="30" y="98">request actions</text>
          <text x="30" y="124" fill="#A8431F" font-weight="700">CANNOT</text><text x="30" y="140">access internal</text><text x="30" y="153">tools directly</text>
          <text x="200" y="82" fill="#0E5C45" font-weight="700">CAN</text><text x="200" y="98">call APIs</text>
          <text x="200" y="124" fill="#A8431F" font-weight="700">CANNOT</text><text x="200" y="140">decide</text><text x="200" y="153">autonomously</text>
          <text x="370" y="82" fill="#0E5C45" font-weight="700">CAN</text><text x="370" y="98">suggest</text>
          <text x="370" y="124" fill="#A8431F" font-weight="700">CANNOT</text><text x="370" y="140">invoke tools or</text><text x="370" y="153">take actions</text>
          <text x="540" y="82" fill="#0E5C45" font-weight="700">CAN</text><text x="540" y="98">invoke tools</text><text x="540" y="111">automatically</text>
          <text x="540" y="135" fill="#A8431F" font-weight="700">CANNOT</text><text x="540" y="151">hold long-lived</text><text x="540" y="164">credentials</text>
        </g>
      </svg>