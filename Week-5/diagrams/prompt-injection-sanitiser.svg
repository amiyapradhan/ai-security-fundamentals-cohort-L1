<svg viewBox="0 0 700 150" role="img" aria-label="Prompt injection: without a sanitiser the model follows the injected instruction; with a sanitiser between the retrieved snippet and the prompt, the attack is mitigated." xmlns="http://www.w3.org/2000/svg" width="700" height="150"><style>.svgtxt{font-family:'Hanken Grotesk','DejaVu Sans',sans-serif;fill:#221C15}.svgmono{font-family:'JetBrains Mono','DejaVu Sans Mono',monospace}.svgmut{fill:#6E6557}</style><rect x="0" y="0" width="700" height="150" fill="#FAF6EF"/>
        <g class="svgtxt" font-size="9.5" font-weight="700" text-anchor="middle">
          <rect x="20" y="40" width="92" height="44" rx="8" fill="#FBE7DD" stroke="#EEB69D"/><text x="66" y="58">MALICIOUS</text><text x="66" y="71">DOC (RAG)</text>
          <rect x="300" y="40" width="78" height="44" rx="8" fill="#FFFDF8" stroke="#E5DCCC"/><text x="339" y="66">PROMPT</text>
          <rect x="440" y="40" width="78" height="44" rx="8" fill="#0E5C45"/><text x="479" y="66" fill="#FAF6EF">MODEL</text>
        </g>
        <polygon points="190,44 222,44 230,62 222,80 190,80 182,62" fill="#FBEFD2" stroke="#EAC982"/>
        <text x="206" y="59" text-anchor="middle" class="svgtxt" font-size="8" font-weight="700" fill="#8A5A12">SANI-</text>
        <text x="206" y="69" text-anchor="middle" class="svgtxt" font-size="8" font-weight="700" fill="#8A5A12">TISER</text>
        <g stroke="#9a917f" stroke-width="1.6" fill="none" marker-end="url(#ar4)">
          <defs><marker id="ar4" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a917f"/></marker></defs>
          <line x1="112" y1="62" x2="180" y2="62"/><line x1="232" y1="62" x2="298" y2="62"/><line x1="378" y1="62" x2="438" y2="62"/>
        </g>
        <rect x="560" y="40" width="118" height="44" rx="8" fill="#E4F1EA" stroke="#A6D4C0"/>
        <text x="619" y="58" text-anchor="middle" class="svgtxt" font-size="9" font-weight="700" fill="#0E5C45">✓ MITIGATED</text>
        <text x="619" y="72" text-anchor="middle" class="svgtxt" font-size="7.5" fill="#6E6557">vs ✗ model obeys</text>
        <line x1="518" y1="62" x2="558" y2="62" stroke="#A6D4C0" stroke-width="1.6" marker-end="url(#ar4)"/>
        <text x="350" y="118" text-anchor="middle" class="svgtxt svgmut" font-size="10" font-style="italic">separate data from instructions: validate/delimit retrieved text before it reaches the model</text>
      </svg>