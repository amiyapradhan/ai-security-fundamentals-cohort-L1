<svg viewBox="0 0 700 200" role="img" aria-label="Unsafe design passes an API key directly into the model. Safe design keeps the key in an orchestration layer that uses it and passes only the processed result; the model never receives secrets." xmlns="http://www.w3.org/2000/svg" width="700" height="200"><style>.svgtxt{font-family:'Hanken Grotesk','DejaVu Sans',sans-serif;fill:#221C15}.svgmono{font-family:'JetBrains Mono','DejaVu Sans Mono',monospace}.svgmut{fill:#6E6557}</style><rect x="0" y="0" width="700" height="200" fill="#FAF6EF"/>
        <text x="20" y="34" class="svgtxt" font-size="11" font-weight="700" fill="#A8431F">UNSAFE — key goes into the model</text>
        <g class="svgmono" font-size="9.5">
          <rect x="40" y="46" width="190" height="30" rx="7" fill="#FBE7DD" stroke="#EEB69D"/><text x="135" y="65" text-anchor="middle" fill="#221C15">✗ API_KEY=abcd1234</text>
        </g>
        <line x1="232" y1="61" x2="318" y2="61" stroke="#9a917f" stroke-width="1.6" marker-end="url(#ar3)"/>
        <defs><marker id="ar3" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a917f"/></marker></defs>
        <rect x="324" y="42" width="92" height="40" rx="9" fill="#FBE7DD" stroke="#A8431F"/><text x="370" y="66" text-anchor="middle" class="svgtxt" font-size="11" font-weight="700">MODEL</text>
        <text x="470" y="66" class="svgtxt" font-size="10" fill="#A8431F">may leak via output / logs / memory</text>

        <text x="20" y="118" class="svgtxt" font-size="11" font-weight="700" fill="#0E5C45">SAFE — orchestration uses the key, model gets only results</text>
        <g class="svgmono" font-size="9.5">
          <rect x="40" y="130" width="150" height="30" rx="7" fill="#E4F1EA" stroke="#A6D4C0"/><text x="115" y="149" text-anchor="middle" fill="#221C15">✓ API_KEY=…</text>
        </g>
        <rect x="206" y="128" width="150" height="34" rx="8" fill="#FFFDF8" stroke="#A6D4C0"/><text x="281" y="149" text-anchor="middle" class="svgtxt" font-size="9.5" font-weight="700">ORCHESTRATION</text>
        <line x1="190" y1="145" x2="204" y2="145" stroke="#9a917f" stroke-width="1.6"/>
        <line x1="356" y1="145" x2="430" y2="145" stroke="#A6D4C0" stroke-width="1.6" marker-end="url(#ar3)"/>
        <text x="393" y="138" text-anchor="middle" class="svgmono" font-size="7.5" fill="#0E5C45">processed result</text>
        <rect x="436" y="125" width="92" height="40" rx="9" fill="#0E5C45"/><text x="482" y="149" text-anchor="middle" class="svgtxt" font-size="11" font-weight="700" fill="#FAF6EF">MODEL</text>
        <text x="540" y="149" class="svgtxt" font-size="9" font-style="italic" fill="#6E6557">never receives secrets</text>
      </svg>