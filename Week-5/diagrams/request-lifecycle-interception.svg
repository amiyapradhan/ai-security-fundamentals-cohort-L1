<svg viewBox="0 0 700 168" role="img" aria-label="An AI request lifecycle with a control gate at each stage: user input, input validation, orchestration, policy enforcement, model as untrusted suggestion, output gating, system action." xmlns="http://www.w3.org/2000/svg" width="700" height="168"><style>.svgtxt{font-family:'Hanken Grotesk','DejaVu Sans',sans-serif;fill:#221C15}.svgmono{font-family:'JetBrains Mono','DejaVu Sans Mono',monospace}.svgmut{fill:#6E6557}</style><rect x="0" y="0" width="700" height="168" fill="#FAF6EF"/>
        <defs>
          <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a917f"/></marker>
        </defs>
        <g font-size="10.5" class="svgtxt" text-anchor="middle" font-weight="700">
          <rect x="14" y="50" width="92" height="52" rx="9" fill="#F4EEE3" stroke="#E5DCCC"/><text x="60" y="80">USER INPUT</text>
          <rect x="170" y="50" width="100" height="52" rx="9" fill="#FFFDF8" stroke="#A6D4C0"/><text x="220" y="73">ORCHEST-</text><text x="220" y="88">RATION</text>
          <rect x="334" y="50" width="100" height="52" rx="9" fill="#0E5C45"/><text x="384" y="73" fill="#FAF6EF">MODEL</text><text x="384" y="89" fill="#FAF6EF" font-size="8" font-weight="400">untrusted</text>
          <rect x="498" y="50" width="100" height="52" rx="9" fill="#FFFDF8" stroke="#A6D4C0"/><text x="548" y="73">SYSTEM</text><text x="548" y="88">ACTION</text>
        </g>
        <g stroke="#9a917f" stroke-width="1.6" fill="none" marker-end="url(#ar)">
          <line x1="106" y1="76" x2="166" y2="76"/>
          <line x1="270" y1="76" x2="330" y2="76"/>
          <line x1="434" y1="76" x2="494" y2="76"/>
        </g>
        <g class="svgmono" font-size="8" fill="#0E5C45" text-anchor="middle" font-weight="700">
          <text x="136" y="40">▼ input</text><text x="136" y="116">validation</text>
          <text x="300" y="40">▼ policy</text><text x="300" y="116">enforcement</text>
          <text x="464" y="40">▼ output</text><text x="464" y="116">gating</text>
        </g>
        <text x="350" y="158" text-anchor="middle" class="svgtxt svgmut" font-size="10" font-style="italic">a control gate sits at every arrow — the model's output is only ever a suggestion</text>
      </svg>