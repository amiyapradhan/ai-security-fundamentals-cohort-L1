<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-26 -26 752 302" width="752" height="302" role="img" aria-label="A four-step loop showing autonomy compounding errors: a model decision leads to an action taken, which is stored in memory or state, which influences the next decision, feeding back into the model decision. An incorrect assumption introduced at the top compounds each cycle."><style>text{font-family:'Hanken Grotesk','Helvetica Neue',Arial,sans-serif;}.svgmono{font-family:'JetBrains Mono','DejaVu Sans Mono',monospace;}</style><rect x="-26" y="-26" width="752" height="302" rx="18" fill="#FFFDF8" stroke="#E5DCCC" stroke-width="1.5"/>
        <defs><marker id="ar10" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#A8431F"/></marker></defs>
        <rect x="250" y="26" width="200" height="46" rx="10" fill="#FBE7DD" stroke="#EEB69D"/>
        <text fill="#221C15" x="350" y="54" text-anchor="middle" class="svgtxt" font-size="12" font-weight="700">MODEL DECISION</text>
        <rect x="504" y="102" width="176" height="46" rx="10" fill="#F4EEE3" stroke="#E5DCCC"/>
        <text fill="#221C15" x="592" y="130" text-anchor="middle" class="svgtxt" font-size="12" font-weight="700">ACTION TAKEN</text>
        <rect x="250" y="178" width="200" height="46" rx="10" fill="#F4EEE3" stroke="#E5DCCC"/>
        <text fill="#221C15" x="350" y="200" text-anchor="middle" class="svgtxt" font-size="11.5" font-weight="700">STORED IN</text>
        <text fill="#221C15" x="350" y="216" text-anchor="middle" class="svgtxt" font-size="11.5" font-weight="700">MEMORY / STATE</text>
        <rect x="20" y="102" width="176" height="46" rx="10" fill="#F4EEE3" stroke="#E5DCCC"/>
        <text fill="#221C15" x="108" y="124" text-anchor="middle" class="svgtxt" font-size="11.5" font-weight="700">INFLUENCES</text>
        <text fill="#221C15" x="108" y="140" text-anchor="middle" class="svgtxt" font-size="11.5" font-weight="700">NEXT DECISION</text>
        <g stroke="#A8431F" stroke-width="2.4" fill="none" marker-end="url(#ar10)">
          <path d="M450,52 C520,60 560,80 585,100"/>
          <path d="M560,148 C500,180 470,188 452,196"/>
          <path d="M250,200 C180,192 140,172 116,150"/>
          <path d="M108,100 C130,72 200,58 248,50"/>
        </g>
        <text fill="#6E6557" x="350" y="128" text-anchor="middle" class="svgmut" font-size="10" font-style="italic">errors compound over time without intervention</text>
        <text x="450" y="20" class="svgtxt" font-size="9" font-weight="700" fill="#A8431F">&#9888; incorrect assumption introduced here</text>
      </svg>