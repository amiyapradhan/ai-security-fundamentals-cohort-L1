<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1100 225" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>The MITRE ATLAS chain: Tactic, Technique, Vulnerability, Mitigation</title>
  <desc>Four cards left to right. Tactic — the goal — manipulate inputs. Technique — the method — prompt injection. Vulnerability — the opening — no validation or checks. Mitigation — the fix — validate, constrain, gate. Below each: what did they want, how did they do it, what let them, and how do we stop it. The colour runs from red attack through amber weakness to green fix.</desc>

  <defs>
    <marker id="ar-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Card 1: Tactic (attacker goal — strong red) -->
  <rect x="18" y="40" width="220" height="110" rx="10" fill="#F7C1C1" stroke="#E24B4A" stroke-width="1"/>
  <text x="40" y="74" font-size="16" font-weight="700" fill="#501313">1 · Tactic</text>
  <text x="40" y="98" font-size="12.5" font-style="italic" fill="#791F1F">the goal</text>
  <text x="40" y="124" font-size="13" font-weight="500" fill="#501313">manipulate inputs</text>

  <!-- Card 2: Technique (method — coral) -->
  <rect x="298" y="40" width="220" height="110" rx="10" fill="#FCEBEB" stroke="#F09595" stroke-width="1"/>
  <text x="320" y="74" font-size="16" font-weight="700" fill="#791F1F">2 · Technique</text>
  <text x="320" y="98" font-size="12.5" font-style="italic" fill="#A32D2D">the method</text>
  <text x="320" y="124" font-size="13" font-weight="500" fill="#791F1F">prompt injection</text>

  <!-- Card 3: Vulnerability (the opening — amber) -->
  <rect x="578" y="40" width="220" height="110" rx="10" fill="#FAEEDA" stroke="#EF9F27" stroke-width="1"/>
  <text x="600" y="74" font-size="16" font-weight="700" fill="#633806">3 · Vulnerability</text>
  <text x="600" y="98" font-size="12.5" font-style="italic" fill="#854F0B">the opening</text>
  <text x="600" y="124" font-size="13" font-weight="500" fill="#633806">no validation or checks</text>

  <!-- Card 4: Mitigation (the fix — green) -->
  <rect x="858" y="40" width="220" height="110" rx="10" fill="#E8F0E4" stroke="#6FA060" stroke-width="1"/>
  <text x="880" y="74" font-size="16" font-weight="700" fill="#2F5424">4 · Mitigation</text>
  <text x="880" y="98" font-size="12.5" font-style="italic" fill="#3F6B32">the fix</text>
  <text x="880" y="124" font-size="13" font-weight="500" fill="#2F5424">validate, constrain, gate</text>

  <!-- Arrows between stages -->
  <line x1="246" y1="95" x2="290" y2="95" stroke="#73726C" stroke-width="1.5" marker-end="url(#ar-gray)"/>
  <line x1="526" y1="95" x2="570" y2="95" stroke="#73726C" stroke-width="1.5" marker-end="url(#ar-gray)"/>
  <line x1="806" y1="95" x2="850" y2="95" stroke="#73726C" stroke-width="1.5" marker-end="url(#ar-gray)"/>

  <!-- The four questions, one under each stage -->
  <text x="128" y="190" text-anchor="middle" font-size="12" font-style="italic" fill="#5F5E5A">What did they want?</text>
  <text x="408" y="190" text-anchor="middle" font-size="12" font-style="italic" fill="#5F5E5A">How did they do it?</text>
  <text x="688" y="190" text-anchor="middle" font-size="12" font-style="italic" fill="#5F5E5A">What let them?</text>
  <text x="968" y="190" text-anchor="middle" font-size="12" font-style="italic" fill="#5F5E5A">How do we stop it?</text>
</svg>
