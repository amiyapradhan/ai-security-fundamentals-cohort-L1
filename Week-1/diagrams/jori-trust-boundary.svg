<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 984 210" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>Jori's abuse path and its missing trust boundary</title>
  <desc>The email body (untrusted) flows into interpret(), which obeys the text as if it were a command, then into forward(), the capability that reaches outside, ending in data leaving the building. A dashed marker between the email body and interpret() shows where a trust boundary belongs — and notes that Jori has none.</desc>

  <defs>
    <marker id="ar-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#A32D2D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="ar-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Box 1: Email body (untrusted data, neutral/gray) -->
  <rect x="30" y="105" width="195" height="70" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1"/>
  <text x="127.5" y="132" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="600" fill="#2C2C2A">Email body</text>
  <text x="127.5" y="156" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#5F5E5A">sense() — untrusted</text>

  <!-- Box 2: interpret() (the flaw, amber) -->
  <rect x="273" y="105" width="195" height="70" rx="8" fill="#FAEEDA" stroke="#EF9F27" stroke-width="1"/>
  <text x="370.5" y="132" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="600" fill="#633806">interpret()</text>
  <text x="370.5" y="156" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#854F0B">obeys text in body</text>

  <!-- Box 3: forward() (dangerous capability, red) -->
  <rect x="516" y="105" width="195" height="70" rx="8" fill="#FCEBEB" stroke="#F09595" stroke-width="1"/>
  <text x="613.5" y="132" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="600" fill="#791F1F">forward()</text>
  <text x="613.5" y="156" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#A32D2D">reaches outside world</text>

  <!-- Box 4: Data leaves (asset harmed, strong red) -->
  <rect x="759" y="105" width="195" height="70" rx="8" fill="#F7C1C1" stroke="#E24B4A" stroke-width="1"/>
  <text x="856.5" y="132" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="600" fill="#501313">Data leaves</text>
  <text x="856.5" y="156" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#791F1F">the asset, harmed</text>

  <!-- Arrow 1: the dangerous handoff (red) -->
  <line x1="233" y1="140" x2="265" y2="140" stroke="#A32D2D" stroke-width="1.5" marker-end="url(#ar-red)"/>
  <!-- Arrow 2 (neutral) -->
  <line x1="476" y1="140" x2="508" y2="140" stroke="#73726C" stroke-width="1.5" marker-end="url(#ar-gray)"/>
  <!-- Arrow 3 (neutral) -->
  <line x1="719" y1="140" x2="751" y2="140" stroke="#73726C" stroke-width="1.5" marker-end="url(#ar-gray)"/>

  <!-- Missing trust boundary: dashed vertical marker over the first gap -->
  <line x1="249" y1="88" x2="249" y2="186" stroke="#A32D2D" stroke-width="1.5" stroke-dasharray="5 5"/>
  <text x="249" y="58" text-anchor="middle" font-size="12.5" font-weight="600" fill="#A32D2D">trust boundary</text>
  <text x="249" y="76" text-anchor="middle" font-size="12.5" fill="#A32D2D">(missing in jori)</text>
</svg>
