<svg viewBox="0 0 1760 420" width="1760" height="420" role="img" xmlns="http://www.w3.org/2000/svg" class="dgm"><title>Annotated AI-system pipeline: each arrow is labelled with the trust transition it carries, from provenance lost at assembly through to outputs that re-enter as trusted context, all wrapped by access control, monitoring, logging and guardrails.</title><style>
text{font-family:'Hanken Grotesk',system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.th{font-weight:600;font-size:13px;fill:#221C15}
.ts{font-weight:400;font-size:10.5px;fill:#6E6557}
.zl{font-weight:700;font-size:11px;letter-spacing:.04em;text-transform:uppercase;fill:#4A3A8C}
.tl{font-weight:700;font-size:10px;letter-spacing:.01em;fill:#A8431F}
.src{font-weight:400;font-size:9.5px;fill:#938977}
.fb{font-weight:600;font-size:10.5px;fill:#A8431F}
.arr{fill:none;stroke:#9a917f;stroke-width:1.4px}
.arr-fb{fill:none;stroke:#A8431F;stroke-width:1.3px;stroke-dasharray:5 4}
.c-gray rect{fill:#F1ECE1;stroke:#D8CDBA} .c-gray .th{fill:#3a352c} .c-gray .ts{fill:#7b7263}
.c-teal rect{fill:#E4F1EA;stroke:#A6D4C0} .c-teal .th{fill:#0E5C45} .c-teal .ts{fill:#2E7D63}
.c-purple rect{fill:#ECE8F8;stroke:#C6BBEC} .c-purple .th{fill:#4A3A8C} .c-purple .ts{fill:#6E5FB0}
.c-amber rect{fill:#FBEFD2;stroke:#EAC982} .c-amber .th{fill:#8A5A12} .c-amber .ts{fill:#9A6E1E}
</style><rect x="0" y="0" width="1760" height="420" fill="#FAF6EF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9a917f"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#A8431F"/></marker></defs><rect x="20" y="86" width="1480" height="244" rx="16" fill="none" stroke="#C6BBEC" stroke-width="1.3" stroke-dasharray="6 5"/><text class="zl" x="760.0" y="68" text-anchor="middle">Access control · Monitoring · Logging · Guardrails — wrap every arrow</text><text class="src" x="98.0" y="118" text-anchor="middle">user · system · docs · config</text><text class="tl"  x="98.0" y="134" text-anchor="middle">provenance lost on assembly</text><path class="arr" d="M98.0 140 V167" marker-end="url(#ah)"/><g class="node c-gray"><rect x="40" y="170" width="116" height="76" rx="11"/><text class="th" x="98.0" y="205.0" text-anchor="middle">Inputs</text><text class="ts" x="98.0" y="222.0" text-anchor="middle">assembled blob</text></g><g class="node c-teal"><rect x="260" y="170" width="116" height="76" rx="11"/><text class="th" x="318.0" y="205.0" text-anchor="middle">Interface</text><text class="ts" x="318.0" y="222.0" text-anchor="middle">chat · API · batch</text></g><g class="node c-gray"><rect x="480" y="170" width="116" height="76" rx="11"/><text class="th" x="538.0" y="205.0" text-anchor="middle">Context</text><text class="ts" x="538.0" y="222.0" text-anchor="middle">retrieval · RAG</text></g><g class="node c-amber"><rect x="700" y="170" width="116" height="76" rx="11"/><text class="th" x="758.0" y="205.0" text-anchor="middle">Orchestration</text><text class="ts" x="758.0" y="222.0" text-anchor="middle">thresholds · routing</text></g><g class="node c-purple"><rect x="920" y="170" width="116" height="76" rx="11"/><text class="th" x="978.0" y="205.0" text-anchor="middle">Model</text><text class="ts" x="978.0" y="222.0" text-anchor="middle">inference only</text></g><g class="node c-amber"><rect x="1140" y="170" width="116" height="76" rx="11"/><text class="th" x="1198.0" y="205.0" text-anchor="middle">Tools / Actions</text><text class="ts" x="1198.0" y="222.0" text-anchor="middle">propose → execute</text></g><g class="node c-gray"><rect x="1360" y="170" width="116" height="76" rx="11"/><text class="th" x="1418.0" y="205.0" text-anchor="middle">Outputs</text><text class="ts" x="1418.0" y="222.0" text-anchor="middle">trusted as fact</text></g><g class="node c-gray"><rect x="1580" y="170" width="116" height="76" rx="11"/><text class="th" x="1638.0" y="205.0" text-anchor="middle">Downstream</text><text class="ts" x="1638.0" y="222.0" text-anchor="middle">acts on it as truth</text></g><text class="tl" x="208.0" y="196.0" text-anchor="middle">sets the checks</text><path class="arr" d="M156 208.0 H257" marker-end="url(#ah)"/><text class="tl" x="428.0" y="196.0" text-anchor="middle">picks the reality</text><path class="arr" d="M376 208.0 H477" marker-end="url(#ah)"/><text class="tl" x="648.0" y="196.0" text-anchor="middle">signal → decision</text><path class="arr" d="M596 208.0 H697" marker-end="url(#ah)"/><text class="tl" x="868.0" y="196.0" text-anchor="middle">= whole world</text><path class="arr" d="M816 208.0 H917" marker-end="url(#ah)"/><text class="tl" x="1088.0" y="196.0" text-anchor="middle">advice → action</text><path class="arr" d="M1036 208.0 H1137" marker-end="url(#ah)"/><text class="tl" x="1308.0" y="196.0" text-anchor="middle">value → fact</text><path class="arr" d="M1256 208.0 H1357" marker-end="url(#ah)"/><text class="tl" x="1528.0" y="196.0" text-anchor="middle">acts as truth</text><path class="arr" d="M1476 208.0 H1577" marker-end="url(#ah)"/><path class="arr-fb" d="M1655.0 246 C 1655.0 372, 98.0 372, 98.0 249" marker-end="url(#ahr)"/><text class="fb" x="876.5" y="392" text-anchor="middle">logged &amp; stored → retrieved later, re-enters as trusted context</text></svg>