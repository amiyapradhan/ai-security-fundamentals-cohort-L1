<svg width="792.0" height="332.0" viewBox="-16 -16 792.0 332.0" role="img" xmlns="http://www.w3.org/2000/svg" class="dgm"><style>
text{font-family:'Hanken Grotesk',system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.th{font-weight:600;font-size:13px;fill:#221C15}
.ts{font-weight:400;font-size:10.5px;fill:#6E6557}
.zl{font-weight:700;font-size:11px;letter-spacing:.04em;text-transform:uppercase}
.lab{font-weight:600;font-size:10px;fill:#938977}
.node rect{stroke-width:1.3px}
rect[stroke-dasharray]{stroke-width:1.3px}
.arr{fill:none;stroke:#9a917f;stroke-width:1.2px}
.arr-red{fill:none;stroke:#A8431F;stroke-width:1.4px}
.c-gray rect{fill:#F1ECE1;stroke:#D8CDBA} .c-gray .th{fill:#3a352c} .c-gray .ts{fill:#7b7263}
.c-teal rect{fill:#E4F1EA;stroke:#A6D4C0} .c-teal .th{fill:#0E5C45} .c-teal .ts{fill:#2E7D63}
.c-purple rect{fill:#ECE8F8;stroke:#C6BBEC} .c-purple .th{fill:#4A3A8C} .c-purple .ts{fill:#6E5FB0}
.c-coral rect{fill:#FBE7DD;stroke:#EEB69D} .c-coral .th{fill:#A8431F} .c-coral .ts{fill:#B5572F}
.c-amber rect{fill:#FBEFD2;stroke:#EAC982} .c-amber .th{fill:#8A5A12} .c-amber .ts{fill:#9A6E1E}
</style><rect x="-16" y="-16" width="792.0" height="332.0" fill="#FAF6EF"/>
        <title>Retrieval-augmented generation: a query is embedded, used to search a vector store, the retrieved context is combined with the original prompt, and the LLM produces a grounded answer.</title>
        <desc>Query splits into two paths: the original prompt goes to a combine step; the query embedding searches a vector store, returns relevant context, which also goes to the combine step, then to the LLM and the response.</desc>
        <defs><marker id="arwG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
        <g class="node c-gray"><rect x="30" y="108" width="100" height="48" rx="8"/><text class="th" x="80" y="137" text-anchor="middle">Query</text></g>
        <g class="node c-amber"><rect x="440" y="108" width="124" height="48" rx="8"/><text class="th" x="502" y="130" text-anchor="middle">Combine</text><text class="ts" x="502" y="146" text-anchor="middle">prompt + context</text></g>
        <g class="node c-purple"><rect x="610" y="108" width="120" height="48" rx="8"/><text class="th" x="670" y="137" text-anchor="middle">LLM</text></g>
        <g class="node c-amber"><rect x="150" y="212" width="128" height="46" rx="8"/><text class="th" x="214" y="240" text-anchor="middle">Query embedding</text></g>
        <g class="node c-teal"><rect x="312" y="210" width="110" height="50" rx="8"/><text class="th" x="367" y="232" text-anchor="middle">Vector store</text><text class="ts" x="367" y="248" text-anchor="middle">precomputed</text></g>
        <g class="node c-teal"><rect x="456" y="212" width="124" height="46" rx="8"/><text class="th" x="518" y="240" text-anchor="middle">Relevant context</text></g>
        <g class="node c-gray"><rect x="610" y="210" width="120" height="50" rx="8"/><text class="th" x="670" y="232" text-anchor="middle">Response</text><text class="ts" x="670" y="248" text-anchor="middle">grounded</text></g>

        <line x1="130" y1="126" x2="440" y2="126" class="arr" marker-end="url(#arwG)"/><text class="lab" x="285" y="118" text-anchor="middle">original prompt</text>
        <line x1="80" y1="156" x2="170" y2="212" class="arr" marker-end="url(#arwG)"/><text class="lab" x="98" y="190" text-anchor="middle">embed</text>
        <line x1="278" y1="235" x2="312" y2="235" class="arr" marker-end="url(#arwG)"/>
        <line x1="422" y1="235" x2="456" y2="234" class="arr" marker-end="url(#arwG)"/><text class="lab" x="300" y="202" text-anchor="middle">similarity search → top-k</text>
        <line x1="518" y1="212" x2="505" y2="156" class="arr" marker-end="url(#arwG)"/><text class="lab" x="566" y="188" text-anchor="middle">relevant context</text>
        <line x1="564" y1="132" x2="610" y2="132" class="arr" marker-end="url(#arwG)"/>
        <line x1="670" y1="156" x2="670" y2="210" class="arr" marker-end="url(#arwG)"/>
      </svg>