<svg width="792.0" height="632.0" viewBox="-16 -16 792.0 632.0" role="img" xmlns="http://www.w3.org/2000/svg" class="dgm"><style>
text{font-family:'Hanken Grotesk',system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.th{font-weight:600;font-size:13px;fill:#221C15}
.ts{font-weight:400;font-size:10.5px;fill:#6E6557}
.zl{font-weight:700;font-size:11px;letter-spacing:.04em;text-transform:uppercase}
.lab{font-weight:600;font-size:10px;fill:#938977}
.node rect{stroke-width:1.3px}
rect[stroke-dasharray]{stroke-width:1.3px}
.arr{fill:none;stroke:#9a917f;stroke-width:1.2px}
.arr-red{fill:none;stroke:#A8431F;stroke-width:1.4px}
.c-gray rect{fill:#F1ECE1;stroke:#D8CDBA} .c-gray .th{fill:#3a352c} .c-gray .ts{fill:#7b7263}
.c-teal rect{fill:#E4F1EA;stroke:#A6D4C0} .c-teal .th{fill:#0E5C45} .c-teal .ts{fill:#2E7D63}
.c-purple rect{fill:#ECE8F8;stroke:#C6BBEC} .c-purple .th{fill:#4A3A8C} .c-purple .ts{fill:#6E5FB0}
.c-coral rect{fill:#FBE7DD;stroke:#EEB69D} .c-coral .th{fill:#A8431F} .c-coral .ts{fill:#B5572F}
.c-amber rect{fill:#FBEFD2;stroke:#EAC982} .c-amber .th{fill:#8A5A12} .c-amber .ts{fill:#9A6E1E}
</style><rect x="-16" y="-16" width="792.0" height="632.0" fill="#FAF6EF"/>
        <title>Lifecycle threat model: a low-trust experimentation domain feeds, via packaging and deployment, into a higher-trust production domain.</title>
        <desc>Cloud services, third-party libraries and API keys feed data ingestion and a training notebook where an engineer works over SSH; the model is saved, packaged and deployed across the boundary into production, where a jump host mediates updates, an API gateway serves users, and a web server loads the live model. Coral marks supply-chain and credential attack surfaces.</desc>
        <defs><marker id="arwY" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

        <!-- domains -->
        <rect x="22" y="44" width="716" height="252" rx="14" fill="none" stroke="#EEB69D" stroke-dasharray="7 5"/>
        <rect x="22" y="320" width="716" height="258" rx="14" fill="none" stroke="#A6D4C0" stroke-dasharray="7 5"/>
        <text class="zl" x="722" y="64" text-anchor="end" fill="#A8431F">Experimentation · dev/test · low trust</text>
        <text class="zl" x="722" y="340" text-anchor="end" fill="#0E5C45">Production · live · higher trust</text>

        <!-- experimentation -->
        <g class="node c-gray"><rect x="38" y="78" width="100" height="46" rx="8"/><text class="th" x="88" y="105" text-anchor="middle">Cloud services</text></g>
        <g class="node c-coral"><rect x="38" y="150" width="100" height="44" rx="8"/><text class="th" x="88" y="170" text-anchor="middle">3rd-party libs</text><text class="ts" x="88" y="185" text-anchor="middle">imports</text></g>
        <g class="node c-coral"><rect x="38" y="220" width="100" height="42" rx="8"/><text class="th" x="88" y="246" text-anchor="middle">API keys</text></g>
        <g class="node c-gray"><rect x="184" y="118" width="118" height="56" rx="8"/><text class="th" x="243" y="142" text-anchor="middle">Data ingestion</text><text class="ts" x="243" y="159" text-anchor="middle">load · store</text></g>
        <g class="node c-gray"><rect x="338" y="108" width="132" height="62" rx="8"/><text class="th" x="404" y="134" text-anchor="middle">Notebook / training</text><text class="ts" x="404" y="151" text-anchor="middle">experiment · train</text></g>
        <g class="node c-coral"><rect x="338" y="214" width="132" height="48" rx="8"/><text class="th" x="404" y="234" text-anchor="middle">Engineer</text><text class="ts" x="404" y="250" text-anchor="middle">VS Code over SSH</text></g>
        <g class="node c-purple"><rect x="512" y="78" width="106" height="48" rx="8"/><text class="th" x="565" y="98" text-anchor="middle">ML model</text><text class="ts" x="565" y="114" text-anchor="middle">saved .h5</text></g>
        <g class="node c-amber"><rect x="556" y="186" width="126" height="60" rx="8"/><text class="th" x="619" y="210" text-anchor="middle">Package /</text><text class="th" x="619" y="226" text-anchor="middle">deployment</text></g>

        <!-- exp arrows -->
        <line x1="138" y1="100" x2="184" y2="135" class="arr" marker-end="url(#arwY)"/><text class="lab" x="158" y="112" text-anchor="middle">https</text>
        <line x1="138" y1="170" x2="184" y2="152" class="arr-red" marker-end="url(#arwY)"/>
        <line x1="138" y1="240" x2="184" y2="168" class="arr-red" marker-end="url(#arwY)"/>
        <line x1="302" y1="144" x2="338" y2="140" class="arr" marker-end="url(#arwY)"/>
        <line x1="404" y1="214" x2="404" y2="170" class="arr-red" marker-end="url(#arwY)"/><text class="lab" x="436" y="195" text-anchor="middle">SSH</text>
        <line x1="470" y1="132" x2="512" y2="104" class="arr" marker-end="url(#arwY)"/><text class="lab" x="492" y="116" text-anchor="middle">save .h5</text>
        <line x1="565" y1="126" x2="600" y2="186" class="arr" marker-end="url(#arwY)"/><text class="lab" x="606" y="156" text-anchor="middle">export</text>

        <!-- cross-boundary deploy -->
        <line x1="619" y1="246" x2="619" y2="300" class="arr" marker-end="url(#arwY)"/>
        <line x1="619" y1="300" x2="372" y2="356" class="arr" marker-end="url(#arwY)"/>
        <text class="lab" x="540" y="318" text-anchor="middle">deploy across the boundary</text>

        <!-- production -->
        <g class="node c-amber"><rect x="300" y="350" width="124" height="56" rx="8"/><text class="th" x="362" y="374" text-anchor="middle">Jump host</text><text class="ts" x="362" y="391" text-anchor="middle">controlled access</text></g>
        <g class="node c-gray"><rect x="556" y="352" width="132" height="48" rx="8"/><text class="th" x="622" y="372" text-anchor="middle">Administrator</text><text class="ts" x="622" y="388" text-anchor="middle">ssh</text></g>
        <g class="node c-amber"><rect x="180" y="446" width="116" height="54" rx="8"/><text class="th" x="238" y="470" text-anchor="middle">API gateway</text><text class="ts" x="238" y="487" text-anchor="middle">HTTPS ingress</text></g>
        <g class="node c-gray"><rect x="40" y="448" width="100" height="50" rx="8"/><text class="th" x="90" y="478" text-anchor="middle">User</text></g>
        <g class="node c-gray"><rect x="332" y="456" width="128" height="58" rx="8"/><text class="th" x="396" y="480" text-anchor="middle">Python web server</text><text class="ts" x="396" y="497" text-anchor="middle">loads model · serves</text></g>
        <g class="node c-coral"><rect x="40" y="520" width="100" height="44" rx="8"/><text class="th" x="90" y="540" text-anchor="middle">3rd-party libs</text><text class="ts" x="90" y="555" text-anchor="middle">imports</text></g>
        <g class="node c-coral"><rect x="500" y="450" width="116" height="44" rx="8"/><text class="th" x="558" y="470" text-anchor="middle">Authorised keys</text></g>
        <g class="node c-purple"><rect x="512" y="520" width="106" height="46" rx="8"/><text class="th" x="565" y="540" text-anchor="middle">ML model</text><text class="ts" x="565" y="556" text-anchor="middle">live</text></g>

        <!-- prod arrows -->
        <line x1="556" y1="376" x2="424" y2="378" class="arr-red" marker-end="url(#arwY)"/><text class="lab" x="492" y="370" text-anchor="middle">ssh</text>
        <line x1="324" y1="406" x2="262" y2="446" class="arr" marker-end="url(#arwY)"/><text class="lab" x="276" y="424" text-anchor="middle">update</text>
        <line x1="362" y1="406" x2="390" y2="456" class="arr" marker-end="url(#arwY)"/><text class="lab" x="392" y="430" text-anchor="middle">update / load</text>
        <line x1="180" y1="473" x2="140" y2="473" class="arr" marker-start="url(#arwY)" marker-end="url(#arwY)"/><text class="lab" x="160" y="466" text-anchor="middle">https</text>
        <line x1="296" y1="478" x2="332" y2="482" class="arr" marker-end="url(#arwY)"/>
        <line x1="140" y1="540" x2="332" y2="500" class="arr-red" marker-end="url(#arwY)"/>
        <line x1="500" y1="476" x2="460" y2="486" class="arr-red" marker-end="url(#arwY)"/>
        <line x1="460" y1="494" x2="512" y2="534" class="arr" marker-end="url(#arwY)"/><text class="lab" x="498" y="516" text-anchor="middle">loads</text>
      </svg>