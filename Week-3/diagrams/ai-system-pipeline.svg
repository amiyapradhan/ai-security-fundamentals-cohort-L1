<svg width="1250" height="380" viewBox="0 0 1250 380" role="img" xmlns="http://www.w3.org/2000/svg" class="dgm"><title>AI system pipeline: inputs flow through interface, context construction, orchestration, the model, tools and actions, to outputs and downstream systems, wrapped by a governance band of access control, monitoring, logging and guardrails.</title><style>
text{font-family:'Hanken Grotesk',system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.th{font-weight:600;font-size:13px;fill:#221C15}
.ts{font-weight:400;font-size:10.5px;fill:#6E6557}
.zl{font-weight:700;font-size:11px;letter-spacing:.04em;text-transform:uppercase;fill:#4A3A8C}
.note{font-weight:400;font-size:11px;fill:#6E6557;font-style:italic}
.arr{fill:none;stroke:#9a917f;stroke-width:1.4px}
.c-gray rect{fill:#F1ECE1;stroke:#D8CDBA} .c-gray .th{fill:#3a352c} .c-gray .ts{fill:#7b7263}
.c-teal rect{fill:#E4F1EA;stroke:#A6D4C0} .c-teal .th{fill:#0E5C45} .c-teal .ts{fill:#2E7D63}
.c-purple rect{fill:#ECE8F8;stroke:#C6BBEC} .c-purple .th{fill:#4A3A8C} .c-purple .ts{fill:#6E5FB0}
.c-amber rect{fill:#FBEFD2;stroke:#EAC982} .c-amber .th{fill:#8A5A12} .c-amber .ts{fill:#9A6E1E}
</style><rect x="0" y="0" width="1250" height="380" fill="#FAF6EF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9a917f"/></marker></defs><rect x="22" y="84" width="992" height="206" rx="16" fill="none" stroke="#C6BBEC" stroke-width="1.3" stroke-dasharray="6 5"/><text class="zl" x="518.0" y="68" text-anchor="middle">Access control · Monitoring · Logging · Guardrails — wrap every stage</text><g class="node c-gray"><rect x="40" y="150" width="122" height="74" rx="11"/><text class="th" x="101.0" y="184.0" text-anchor="middle">Inputs</text><text class="ts" x="101.0" y="201.0" text-anchor="middle">many sources</text></g><g class="node c-teal"><rect x="178" y="150" width="122" height="74" rx="11"/><text class="th" x="239.0" y="184.0" text-anchor="middle">Interface</text><text class="ts" x="239.0" y="201.0" text-anchor="middle">chat · API · batch</text></g><g class="node c-gray"><rect x="316" y="150" width="122" height="74" rx="11"/><text class="th" x="377.0" y="184.0" text-anchor="middle">Context</text><text class="ts" x="377.0" y="201.0" text-anchor="middle">retrieval · RAG</text></g><g class="node c-amber"><rect x="454" y="150" width="122" height="74" rx="11"/><text class="th" x="515.0" y="184.0" text-anchor="middle">Orchestration</text><text class="ts" x="515.0" y="201.0" text-anchor="middle">thresholds · routing</text></g><g class="node c-purple"><rect x="592" y="150" width="122" height="74" rx="11"/><text class="th" x="653.0" y="184.0" text-anchor="middle">Model</text><text class="ts" x="653.0" y="201.0" text-anchor="middle">inference only</text></g><g class="node c-amber"><rect x="730" y="150" width="122" height="74" rx="11"/><text class="th" x="791.0" y="184.0" text-anchor="middle">Tools / Actions</text><text class="ts" x="791.0" y="201.0" text-anchor="middle">propose → execute</text></g><g class="node c-gray"><rect x="868" y="150" width="122" height="74" rx="11"/><text class="th" x="929.0" y="184.0" text-anchor="middle">Outputs</text><text class="ts" x="929.0" y="201.0" text-anchor="middle">trusted as fact</text></g><g class="node c-gray"><rect x="1060" y="150" width="122" height="74" rx="11"/><text class="th" x="1121.0" y="184.0" text-anchor="middle">Downstream</text><text class="ts" x="1121.0" y="201.0" text-anchor="middle">acts on it as truth</text></g><path class="arr" d="M162 187.0 H175" marker-end="url(#ah)"/><path class="arr" d="M300 187.0 H313" marker-end="url(#ah)"/><path class="arr" d="M438 187.0 H451" marker-end="url(#ah)"/><path class="arr" d="M576 187.0 H589" marker-end="url(#ah)"/><path class="arr" d="M714 187.0 H727" marker-end="url(#ah)"/><path class="arr" d="M852 187.0 H865" marker-end="url(#ah)"/><path class="arr" d="M990 187.0 H1057" marker-end="url(#ah)"/><text class="note" x="625" y="332" text-anchor="middle">The model is one box. Risk is born at every arrow — where trust changes hands.</text></svg>