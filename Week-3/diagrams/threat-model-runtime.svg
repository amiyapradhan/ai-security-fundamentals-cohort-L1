<svg width="792.0" height="462.0" viewBox="-16 -16 792.0 462.0" role="img" xmlns="http://www.w3.org/2000/svg" class="dgm"><style>
text{font-family:'Hanken Grotesk',system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.th{font-weight:600;font-size:13px;fill:#221C15}
.ts{font-weight:400;font-size:10.5px;fill:#6E6557}
.zl{font-weight:700;font-size:11px;letter-spacing:.04em;text-transform:uppercase}
.lab{font-weight:600;font-size:10px;fill:#938977}
.node rect{stroke-width:1.3px}
rect[stroke-dasharray]{stroke-width:1.3px}
.arr{fill:none;stroke:#9a917f;stroke-width:1.2px}
.arr-red{fill:none;stroke:#A8431F;stroke-width:1.4px}
.c-gray rect{fill:#F1ECE1;stroke:#D8CDBA} .c-gray .th{fill:#3a352c} .c-gray .ts{fill:#7b7263}
.c-teal rect{fill:#E4F1EA;stroke:#A6D4C0} .c-teal .th{fill:#0E5C45} .c-teal .ts{fill:#2E7D63}
.c-purple rect{fill:#ECE8F8;stroke:#C6BBEC} .c-purple .th{fill:#4A3A8C} .c-purple .ts{fill:#6E5FB0}
.c-coral rect{fill:#FBE7DD;stroke:#EEB69D} .c-coral .th{fill:#A8431F} .c-coral .ts{fill:#B5572F}
.c-amber rect{fill:#FBEFD2;stroke:#EAC982} .c-amber .th{fill:#8A5A12} .c-amber .ts{fill:#9A6E1E}
</style><rect x="-16" y="-16" width="792.0" height="462.0" fill="#FAF6EF"/>
        <title>Runtime threat model: a request flows from a low-trust client through a medium-trust API/authorisation perimeter into high-trust internal services.</title>
        <desc>User and browser client in the low-trust zone; model API endpoint and authorisation service in the medium-trust perimeter; data generator, embedding store and user profiles in the high-trust internal zone, with authentication and permission flows between them.</desc>
        <defs><marker id="arwR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

        <!-- zones -->
        <rect x="24" y="66" width="214" height="150" rx="14" fill="none" stroke="#EEB69D" stroke-dasharray="7 5"/>
        <rect x="300" y="44" width="176" height="330" rx="14" fill="none" stroke="#EAC982" stroke-dasharray="7 5"/>
        <rect x="560" y="44" width="176" height="330" rx="14" fill="none" stroke="#A6D4C0" stroke-dasharray="7 5"/>
        <text class="zl" x="131" y="236" text-anchor="middle" fill="#A8431F">External client · low trust</text>
        <text class="zl" x="388" y="394" text-anchor="middle" fill="#8A5A12">Perimeter / API · medium trust</text>
        <text class="zl" x="648" y="394" text-anchor="middle" fill="#0E5C45">Internal services · high trust</text>

        <!-- low zone nodes -->
        <g class="node c-gray"><rect x="40" y="100" width="84" height="58" rx="9"/><text class="th" x="82" y="133" text-anchor="middle">User</text></g>
        <g class="node c-gray"><rect x="146" y="100" width="78" height="58" rx="9"/><text class="th" x="185" y="125" text-anchor="middle">Browser</text><text class="th" x="185" y="141" text-anchor="middle">client</text></g>

        <!-- perimeter nodes -->
        <g class="node c-amber"><rect x="320" y="76" width="136" height="64" rx="9"/><text class="th" x="388" y="102" text-anchor="middle">Model API endpoint</text><text class="ts" x="388" y="120" text-anchor="middle">authN + routing</text></g>
        <g class="node c-amber"><rect x="320" y="276" width="136" height="64" rx="9"/><text class="th" x="388" y="302" text-anchor="middle">Authorisation service</text><text class="ts" x="388" y="320" text-anchor="middle">permission checks</text></g>

        <!-- internal nodes -->
        <g class="node c-teal"><rect x="582" y="70" width="136" height="50" rx="9"/><text class="th" x="650" y="99" text-anchor="middle">Data generator</text></g>
        <g class="node c-teal"><rect x="582" y="138" width="136" height="56" rx="9"/><text class="th" x="650" y="162" text-anchor="middle">Embedding store</text><text class="ts" x="650" y="179" text-anchor="middle">vectors · retrieval</text></g>
        <g class="node c-teal"><rect x="582" y="282" width="136" height="52" rx="9"/><text class="th" x="650" y="305" text-anchor="middle">User profiles</text><text class="ts" x="650" y="322" text-anchor="middle">identity · policy</text></g>

        <!-- arrows -->
        <line x1="124" y1="129" x2="146" y2="129" class="arr" marker-start="url(#arwR)" marker-end="url(#arwR)"/>
        <line x1="224" y1="116" x2="320" y2="100" class="arr" marker-end="url(#arwR)"/>
        <text class="lab" x="272" y="100" text-anchor="middle">HTTP request</text>
        <line x1="320" y1="124" x2="224" y2="140" class="arr" marker-end="url(#arwR)"/>
        <text class="lab" x="272" y="150" text-anchor="middle">HTTP response</text>

        <line x1="456" y1="98" x2="582" y2="92" class="arr" marker-start="url(#arwR)" marker-end="url(#arwR)"/>
        <text class="lab" x="519" y="84" text-anchor="middle">model req / resp</text>
        <line x1="456" y1="120" x2="582" y2="160" class="arr" marker-start="url(#arwR)" marker-end="url(#arwR)"/>

        <line x1="378" y1="140" x2="378" y2="276" class="arr" marker-end="url(#arwR)"/>
        <text class="lab" x="338" y="210" text-anchor="middle" transform="rotate(-90 338 210)">authN creds</text>
        <line x1="398" y1="276" x2="398" y2="140" class="arr" marker-end="url(#arwR)"/>
        <text class="lab" x="438" y="210" text-anchor="middle" transform="rotate(-90 438 210)">authZ response</text>

        <line x1="456" y1="300" x2="582" y2="300" class="arr" marker-start="url(#arwR)" marker-end="url(#arwR)"/>
        <text class="lab" x="519" y="292" text-anchor="middle">permission check / resp</text>
      </svg>