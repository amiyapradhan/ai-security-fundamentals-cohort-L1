<svg width="752.0" height="352.0" viewBox="-16 -16 752.0 352.0" role="img" xmlns="http://www.w3.org/2000/svg" class="dgm"><style>
text{font-family:'Hanken Grotesk',system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.th{font-weight:600;font-size:13px;fill:#221C15}
.ts{font-weight:400;font-size:10.5px;fill:#6E6557}
.zl{font-weight:700;font-size:11px;letter-spacing:.04em;text-transform:uppercase}
.lab{font-weight:600;font-size:10px;fill:#938977}
.node rect{stroke-width:1.3px}
rect[stroke-dasharray]{stroke-width:1.3px}
.arr{fill:none;stroke:#9a917f;stroke-width:1.2px}
.arr-red{fill:none;stroke:#A8431F;stroke-width:1.4px}
.c-gray rect{fill:#F1ECE1;stroke:#D8CDBA} .c-gray .th{fill:#3a352c} .c-gray .ts{fill:#7b7263}
.c-teal rect{fill:#E4F1EA;stroke:#A6D4C0} .c-teal .th{fill:#0E5C45} .c-teal .ts{fill:#2E7D63}
.c-purple rect{fill:#ECE8F8;stroke:#C6BBEC} .c-purple .th{fill:#4A3A8C} .c-purple .ts{fill:#6E5FB0}
.c-coral rect{fill:#FBE7DD;stroke:#EEB69D} .c-coral .th{fill:#A8431F} .c-coral .ts{fill:#B5572F}
.c-amber rect{fill:#FBEFD2;stroke:#EAC982} .c-amber .th{fill:#8A5A12} .c-amber .ts{fill:#9A6E1E}
</style><rect x="-16" y="-16" width="752.0" height="352.0" fill="#FAF6EF"/>
        <title>Information retrieval: a model's output is shaped by layered inputs — user text, a system instruction, knowledge in the weights, and a live external source — assembled before the call.</title>
        <desc>Four input sources (user input, system instruction, persistent knowledge in the weights, a live cloud source) are assembled and injected as one input to the model, which then produces the answer.</desc>
        <defs><marker id="arwC" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
        <g class="node c-gray"><rect x="30" y="36" width="206" height="52" rx="8"/><text class="th" x="133" y="58" text-anchor="middle">User input</text><text class="ts" x="133" y="75" text-anchor="middle">“What is the time?”</text></g>
        <g class="node c-amber"><rect x="30" y="104" width="206" height="52" rx="8"/><text class="th" x="133" y="126" text-anchor="middle">System instruction</text><text class="ts" x="133" y="143" text-anchor="middle">engineer: “be helpful”</text></g>
        <g class="node c-purple"><rect x="30" y="172" width="206" height="52" rx="8"/><text class="th" x="133" y="194" text-anchor="middle">Persistent knowledge</text><text class="ts" x="133" y="211" text-anchor="middle">in the weights · “concept of time”</text></g>
        <g class="node c-teal"><rect x="30" y="240" width="206" height="52" rx="8"/><text class="th" x="133" y="262" text-anchor="middle">Checks cloud source</text><text class="ts" x="133" y="279" text-anchor="middle">live · time = 17:37</text></g>

        <g class="node c-amber"><rect x="300" y="120" width="120" height="92" rx="10"/><text class="th" x="360" y="160" text-anchor="middle">Assemble +</text><text class="th" x="360" y="177" text-anchor="middle">inject context</text></g>
        <g class="node c-purple"><rect x="484" y="126" width="150" height="80" rx="13"/><text class="th" x="559" y="160" text-anchor="middle">MODEL</text><text class="ts" x="559" y="178" text-anchor="middle">reasons over the blob</text></g>

        <line x1="236" y1="62" x2="300" y2="140" class="arr" marker-end="url(#arwC)"/>
        <line x1="236" y1="130" x2="300" y2="155" class="arr" marker-end="url(#arwC)"/>
        <line x1="236" y1="198" x2="300" y2="172" class="arr" marker-end="url(#arwC)"/>
        <line x1="236" y1="266" x2="300" y2="190" class="arr" marker-end="url(#arwC)"/>
        <line x1="420" y1="166" x2="484" y2="166" class="arr" marker-end="url(#arwC)"/>
        <text class="lab" x="559" y="232" text-anchor="middle">→ “The time is 5:37 PM”</text>
      </svg>