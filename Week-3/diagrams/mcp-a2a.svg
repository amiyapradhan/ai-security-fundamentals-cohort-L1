        <line x1="368" y1="338" x2="430" y2="338" class="arr" marker-start="url(#arwM)" marker-end="url(#arwM)"/>

        <!-- A2A link -->
        <g class="node c-coral"><rect x="586" y="180" width="128" height="70" rx="9"/><text class="th" x="650" y="204" text-anchor="middle">A2A protocol</text><text class="ts" x="650" y="221" text-anchor="middle">share capabilities ·</text><text class="ts" x="650" y="235" text-anchor="middle">coordinate state</text></g>
        <line x1="554" y1="120" x2="586" y2="200" class="arr" marker-end="url(#arwM)"/>
