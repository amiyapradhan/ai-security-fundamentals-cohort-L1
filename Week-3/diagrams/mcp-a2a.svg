</style><rect x="-16" y="-16" width="752.0" height="462.0" fill="#FAF6EF"/>
        <title>MCP and A2A: each agent (an MCP host) runs MCP clients that reach MCP servers, which mediate access to external resources; two agents coordinate over the A2A protocol.</title>
        <desc>Agent A hosts three MCP client to MCP server to resource rows (files/databases, enterprise systems, internet); Agent B hosts two such rows; the A2A protocol links the two agents to share capabilities and coordinate state.</desc>
        <defs><marker id="arwM" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

        <rect x="60" y="26" width="494" height="178" rx="14" fill="none" stroke="#C6BBEC" stroke-dasharray="7 5"/>
        <text class="zl" x="76" y="20" fill="#4A3A8C">Agent A · MCP host</text>
        <rect x="60" y="252" width="494" height="150" rx="14" fill="none" stroke="#A6D4C0" stroke-dasharray="7 5"/>
        <text class="zl" x="76" y="246" fill="#0E5C45">Agent B · MCP host</text>

        <!-- Agent A rows -->
        <g class="node c-amber"><rect x="80" y="42" width="106" height="36" rx="7"/><text class="th" x="133" y="64" text-anchor="middle">MCP client</text></g>
        <g class="node c-purple"><rect x="248" y="42" width="120" height="36" rx="7"/><text class="th" x="308" y="64" text-anchor="middle">MCP server A</text></g>
        <g class="node c-gray"><rect x="430" y="42" width="104" height="36" rx="7"/><text class="th" x="482" y="64" text-anchor="middle">Files / DBs</text></g>
        <g class="node c-amber"><rect x="80" y="94" width="106" height="36" rx="7"/><text class="th" x="133" y="116" text-anchor="middle">MCP client</text></g>
        <g class="node c-purple"><rect x="248" y="94" width="120" height="36" rx="7"/><text class="th" x="308" y="116" text-anchor="middle">MCP server B</text></g>
        <g class="node c-gray"><rect x="430" y="94" width="104" height="36" rx="7"/><text class="th" x="482" y="116" text-anchor="middle">Enterprise</text></g>
        <g class="node c-amber"><rect x="80" y="146" width="106" height="36" rx="7"/><text class="th" x="133" y="168" text-anchor="middle">MCP client</text></g>
        <g class="node c-purple"><rect x="248" y="146" width="120" height="36" rx="7"/><text class="th" x="308" y="168" text-anchor="middle">MCP server C</text></g>
        <g class="node c-gray"><rect x="430" y="146" width="104" height="36" rx="7"/><text class="th" x="482" y="168" text-anchor="middle">Internet / APIs</text></g>

        <line x1="186" y1="60" x2="248" y2="60" class="arr" marker-end="url(#arwM)"/><text class="lab" x="217" y="53" text-anchor="middle">MCP</text>
        <line x1="368" y1="60" x2="430" y2="60" class="arr" marker-start="url(#arwM)" marker-end="url(#arwM)"/>
        <line x1="186" y1="112" x2="248" y2="112" class="arr" marker-end="url(#arwM)"/>
        <line x1="368" y1="112" x2="430" y2="112" class="arr" marker-start="url(#arwM)" marker-end="url(#arwM)"/>
        <line x1="186" y1="164" x2="248" y2="164" class="arr" marker-end="url(#arwM)"/>
        <line x1="368" y1="164" x2="430" y2="164" class="arr" marker-start="url(#arwM)" marker-end="url(#arwM)"/>

        <!-- Agent B rows -->
        <g class="node c-amber"><rect x="80" y="268" width="106" height="36" rx="7"/><text class="th" x="133" y="290" text-anchor="middle">MCP client</text></g>
        <g class="node c-purple"><rect x="248" y="268" width="120" height="36" rx="7"/><text class="th" x="308" y="290" text-anchor="middle">MCP server Y</text></g>
        <g class="node c-gray"><rect x="430" y="268" width="104" height="36" rx="7"/><text class="th" x="482" y="290" text-anchor="middle">Files / DBs</text></g>
        <g class="node c-amber"><rect x="80" y="320" width="106" height="36" rx="7"/><text class="th" x="133" y="342" text-anchor="middle">MCP client</text></g>
        <g class="node c-purple"><rect x="248" y="320" width="120" height="36" rx="7"/><text class="th" x="308" y="342" text-anchor="middle">MCP server Z</text></g>
        <g class="node c-gray"><rect x="430" y="320" width="104" height="36" rx="7"/><text class="th" x="482" y="342" text-anchor="middle">Internet / APIs</text></g>
        <line x1="186" y1="286" x2="248" y2="286" class="arr" marker-end="url(#arwM)"/>
