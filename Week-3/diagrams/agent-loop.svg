<svg width="752.0" height="462.0" viewBox="-16 -16 752.0 462.0" role="img" xmlns="http://www.w3.org/2000/svg" class="dgm"><style>
text{font-family:'Hanken Grotesk',system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.th{font-weight:600;font-size:13px;fill:#221C15}
.ts{font-weight:400;font-size:10.5px;fill:#6E6557}
.zl{font-weight:700;font-size:11px;letter-spacing:.04em;text-transform:uppercase}
.lab{font-weight:600;font-size:10px;fill:#938977}
.node rect{stroke-width:1.3px}
rect[stroke-dasharray]{stroke-width:1.3px}
.arr{fill:none;stroke:#9a917f;stroke-width:1.2px}
.arr-red{fill:none;stroke:#A8431F;stroke-width:1.4px}
.c-gray rect{fill:#F1ECE1;stroke:#D8CDBA} .c-gray .th{fill:#3a352c} .c-gray .ts{fill:#7b7263}
.c-teal rect{fill:#E4F1EA;stroke:#A6D4C0} .c-teal .th{fill:#0E5C45} .c-teal .ts{fill:#2E7D63}
.c-purple rect{fill:#ECE8F8;stroke:#C6BBEC} .c-purple .th{fill:#4A3A8C} .c-purple .ts{fill:#6E5FB0}
.c-coral rect{fill:#FBE7DD;stroke:#EEB69D} .c-coral .th{fill:#A8431F} .c-coral .ts{fill:#B5572F}
.c-amber rect{fill:#FBEFD2;stroke:#EAC982} .c-amber .th{fill:#8A5A12} .c-amber .ts{fill:#9A6E1E}
</style><rect x="-16" y="-16" width="752.0" height="462.0" fill="#FAF6EF"/>
        <title>Agentic loop: an agent given a goal plans, gets data, analyses, drafts a report, and sends a notification, then reorients and repeats, with a human-review gate before sending.</title>
        <desc>Five stages arranged in a ring around a central goal — plan, get data (needs high permissions and may act across systems), analyse, draft report, send notification (with recommended human review) — connected by clockwise arrows that reorient, update and repeat.</desc>
        <defs><marker id="arwA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

        <g class="node c-purple"><rect x="298" y="176" width="124" height="68" rx="11"/><text class="th" x="360" y="204" text-anchor="middle">GOAL</text><text class="ts" x="360" y="222" text-anchor="middle">prepare the weekly update</text></g>

        <g class="node c-amber"><rect x="468" y="86" width="112" height="50" rx="9"/><text class="th" x="524" y="115" text-anchor="middle">Plan</text></g>
        <g class="node c-coral"><rect x="506" y="262" width="126" height="56" rx="9"/><text class="th" x="569" y="284" text-anchor="middle">Get data ⚠</text><text class="ts" x="569" y="301" text-anchor="middle">high perms · cross-system</text></g>
        <g class="node c-amber"><rect x="304" y="338" width="112" height="50" rx="9"/><text class="th" x="360" y="367" text-anchor="middle">Analyse</text></g>
        <g class="node c-amber"><rect x="92" y="262" width="124" height="50" rx="9"/><text class="th" x="154" y="291" text-anchor="middle">Draft report</text></g>
        <g class="node c-amber"><rect x="140" y="86" width="140" height="56" rx="9"/><text class="th" x="210" y="108" text-anchor="middle">Send notification</text><text class="ts" x="210" y="125" text-anchor="middle">✓ human review</text></g>

        <text class="lab" x="360" y="60" text-anchor="middle">reorient, update &amp; repeat ↻</text>
        <path d="M560 130 C 600 170, 610 215, 596 262" class="arr" marker-end="url(#arwA)"/>
        <path d="M520 318 C 480 348, 440 360, 416 360" class="arr" marker-end="url(#arwA)"/>
        <path d="M304 360 C 250 356, 210 336, 190 312" class="arr" marker-end="url(#arwA)"/>
        <path d="M150 262 C 130 210, 150 160, 184 142" class="arr" marker-end="url(#arwA)"/>
        <path d="M280 104 C 360 86, 420 92, 468 104" class="arr" marker-end="url(#arwA)"/>
        <line x1="422" y1="196" x2="476" y2="130" class="arr" marker-end="url(#arwA)" stroke-dasharray="4 4"/>
      </svg>